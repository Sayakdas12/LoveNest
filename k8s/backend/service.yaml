apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: lovenest
  labels:
    app: backend
spec:
  type: NodePort              # Exposes on localhost:<nodePort> in Docker Desktop
  selector:
    app: backend
  ports:
  - name: http
    protocol: TCP
    port: 3000                # ClusterIP port
    targetPort: 3000          # Pod port
    nodePort: 30300           # Access via: http://localhost:30300
